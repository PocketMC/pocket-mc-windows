name: Release Pipeline

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

jobs:
  release-build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      DOTNET_VERSION: "8.0.x"
      RUNTIME: win-x64
      APP_ID: PocketMC

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Parse Root Configuration
        id: config
        shell: pwsh
        run: |
          $content = Get-Content pocketmc.yml -Raw
          $appId = if ($content -match '(?m)^app_id:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "PocketMC" }
          $appName = if ($content -match '(?m)^app_name:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "PocketMC" }
          $orgName = if ($content -match '(?m)^organization_name:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "DS Labs" }
          $version = if ($content -match '(?m)^version:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "1.0.0" }
          $channel = if ($content -match '(?m)^channel:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "none" }
          $githubLink = if ($content -match '(?m)^link_github:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "https://github.com/PocketMC/pocket-mc-windows" }
          $releasesLink = if ($content -match '(?m)^link_releases:\s*([^#\r\n]+)') { $matches[1].Trim(' "''') } else { "https://github.com/PocketMC/pocket-mc-windows/releases" }
          echo "app_id=$appId" >> $env:GITHUB_OUTPUT
          echo "app_name=$appName" >> $env:GITHUB_OUTPUT
          echo "org_name=$orgName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT
          echo "link_github=$githubLink" >> $env:GITHUB_OUTPUT
          echo "link_releases=$releasesLink" >> $env:GITHUB_OUTPUT

      - name: Ensure Release Channel
        id: check_channel
        shell: pwsh
        run: |
          if ("${{ steps.config.outputs.channel }}" -ne "release") {
            echo "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Channel is not release. Exiting gracefully..."
          } else {
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v4
        if: steps.check_channel.outputs.skip == 'false'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack
        if: steps.check_channel.outputs.skip == 'false'
        run: dotnet tool install -g vpk

      - name: Restore (win-x64 RID)
        if: steps.check_channel.outputs.skip == 'false'
        run: dotnet restore PocketMC.Desktop/PocketMC.Desktop.csproj -r ${{ env.RUNTIME }}

      - name: Publish Multi-DLL (Velopack input)
        if: steps.check_channel.outputs.skip == 'false'
        run: |
          dotnet publish PocketMC.Desktop/PocketMC.Desktop.csproj `
            -c Release `
            -r $env:RUNTIME `
            --self-contained false `
            --no-restore `
            -p:Version=${{ steps.config.outputs.version }} `
            -o publish

      - name: Download previous release assets
        if: steps.check_channel.outputs.skip == 'false'
        uses: robinraju/release-downloader@v1
        with:
          repository: PocketMC/pocket-mc-windows
          latest: true
          fileName: "*"
          out-file-path: Releases
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack with Velopack
        if: steps.check_channel.outputs.skip == 'false'
        run: >
          vpk pack
          --packId ${{ steps.config.outputs.app_id }}
          --packVersion ${{ steps.config.outputs.version }}
          --packTitle "${{ steps.config.outputs.app_name }}"
          --packAuthors "${{ steps.config.outputs.org_name }}"
          --icon "PocketMC.Desktop/icon.ico"
          --packDir publish
          --mainExe "${{ steps.config.outputs.app_name }}.exe"
          --framework net8.0,net8.0-aspnetcore
          --runtime ${{ env.RUNTIME }}
          --outputDir Releases

      - name: Upload Release Artifacts
        if: steps.check_channel.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: PocketMC-Release-${{ steps.config.outputs.version }}
          path: Releases/

      - name: Extract release notes
        if: steps.check_channel.outputs.skip == 'false'
        id: notes
        shell: pwsh
        run: |
          $targetVersion = "${{ steps.config.outputs.version }}".Trim().TrimStart('v')
          $body = ""
          $discordBody = ""

          # 1. Parse GitHub Release notes directly from CHANGELOG.md
          if (Test-Path -Path "CHANGELOG.md") {
            $changelog = Get-Content -Path "CHANGELOG.md" -Raw
            $escaped = [regex]::Escape($targetVersion)
            $pattern = "(?ms)^##\s*v?${escaped}\b[^\r\n]*\r?\n(.*?)(?=\r?\n---\s*(\r?\n|\Z)|\r?\n##\s|\Z)"
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success -and -not [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
              $body = $match.Groups[1].Value.Trim()
              Write-Host "Successfully extracted changelog section for v$targetVersion from CHANGELOG.md ($($body.Length) chars)"
            }
          }

          # 2. Parse Discord release announcement strictly from WhatsNew.txt
          if (Test-Path -Path "PocketMC.Desktop/Assets/WhatsNew.txt") {
            $whatsnew = Get-Content -Path "PocketMC.Desktop/Assets/WhatsNew.txt" -Raw
            $lines = $whatsnew -split '\r?\n'
            $formatted = @()
            foreach ($line in $lines) {
              $trimmed = $line.Trim()
              if ($trimmed -match "^VERSION=") { continue }
              elseif ($trimmed -match "^\[(.*)\]$") { 
                $sectionTitle = (Get-Culture).TextInfo.ToTitleCase($matches[1].ToLower())
                $formatted += "`n### ❯ $sectionTitle" 
              }
              elseif ([string]::IsNullOrWhiteSpace($trimmed)) { continue }
              else { 
                $cleanItem = $trimmed -replace '^[-*•]\s*', ''
                $formatted += " • $cleanItem" 
              }
            }
            $discordBody = ($formatted -join "`n").Trim()
          }

          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = if (-not [string]::IsNullOrWhiteSpace($discordBody)) { $discordBody } else { "PocketMC v${targetVersion} is now available." }
          }
          if ([string]::IsNullOrWhiteSpace($discordBody)) {
            $discordBody = $body
          }

          $EOF1 = [guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$EOF1"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $EOF1

          $EOF2 = [guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "discord_body<<$EOF2"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $discordBody
          Add-Content -Path $env:GITHUB_OUTPUT -Value $EOF2

      - name: Create GitHub Release
        if: steps.check_channel.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.config.outputs.version }}
          name: ${{ steps.config.outputs.app_name }} v${{ steps.config.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            Releases/${{ steps.config.outputs.app_id }}-${{ steps.config.outputs.version }}-full.nupkg
            Releases/${{ steps.config.outputs.app_id }}-${{ steps.config.outputs.version }}-delta.nupkg
            Releases/${{ steps.config.outputs.app_id }}-win-Setup.exe
            Releases/${{ steps.config.outputs.app_id }}-win-Portable.zip
            Releases/releases.win.json
            Releases/assets.win.json
            Releases/RELEASES
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord Release Notification
        if: steps.check_channel.outputs.skip == 'false'
        shell: pwsh
        env:
          BODY: ${{ steps.notes.outputs.discord_body }}
        run: |
          $webhookUrl = "${{ secrets.DISCORD_RELEASE_WEBHOOK }}"
          if (-not $webhookUrl) { Write-Warning "DISCORD_RELEASE_WEBHOOK not set."; exit 0 }

          $body = $env:BODY
          if ($body.Length -gt 3900) { $body = $body.Substring(0, 3900) + "... *(truncated)*" }

          $payload = @{
            content = "<@&1493922983742537819>"
            embeds = @(@{
              title       = "❖ ${{ steps.config.outputs.app_name }} v${{ steps.config.outputs.version }} Available ❖"
              description = $body
              color       = 3066993
              image       = @{ url = "https://cdn.discordapp.com/attachments/1493841758864412715/1512177063572934717/banner.png" }
              footer      = @{ text = "${{ steps.config.outputs.app_name }} Build System" }
            })
            components = @(
              @{
                type = 1
                components = @(
                  @{
                    type = 2
                    style = 5
                    label = "Download Release"
                    url = "${{ steps.config.outputs.link_releases }}/tag/v${{ steps.config.outputs.version }}"
                  },
                  @{
                    type = 2
                    style = 5
                    label = "View Full Changelog"
                    url = "${{ steps.config.outputs.link_github }}/blob/master/CHANGELOG.md"
                  }
                )
              }
            )
          }
          try {
            Invoke-RestMethod -Uri $webhookUrl -Method Post -Body ($payload | ConvertTo-Json -Depth 5) -ContentType "application/json"
          } catch {
            Write-Warning "Failed to send Discord notification: $_"
          }
